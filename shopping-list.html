<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛒 쇼핑리스트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px 60px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 28px 28px 24px;
      color: #fff;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header p {
      margin-top: 4px;
      font-size: 0.85rem;
      opacity: 0.8;
    }
    .summary {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }
    .badge {
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge span { font-weight: 400; opacity: 0.85; }

    /* ── Input area ── */
    .input-area {
      padding: 20px 20px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    .input-row input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e8e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      color: #333;
    }
    .input-row input[type="text"]:focus { border-color: #667eea; }
    .input-row input[type="text"]::placeholder { color: #bbb; }

    .btn-add {
      padding: 12px 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn-add:hover { opacity: 0.9; }
    .btn-add:active { transform: scale(0.96); }

    /* ── Filter tabs ── */
    .filter-tabs {
      display: flex;
      padding: 12px 20px 0;
      gap: 8px;
    }
    .tab {
      padding: 6px 14px;
      border: none;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      background: #f0f0f8;
      color: #888;
      transition: all 0.18s;
    }
    .tab.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
    }

    /* ── List ── */
    .list-area {
      padding: 8px 0 4px;
      min-height: 120px;
    }

    .empty-state {
      padding: 48px 20px;
      text-align: center;
      color: #bbb;
    }
    .empty-state .icon { font-size: 2.5rem; }
    .empty-state p { margin-top: 10px; font-size: 0.9rem; }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #f5f5f8;
      transition: background 0.15s;
      animation: fadeIn 0.22s ease;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #fafafa; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Custom checkbox */
    .checkbox-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .checkbox-wrap input[type="checkbox"] { display: none; }
    .checkbox-wrap label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border: 2px solid #d0d0e0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s;
      background: #fff;
    }
    .checkbox-wrap input:checked + label {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: transparent;
    }
    .checkbox-wrap label::after {
      content: '✓';
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .checkbox-wrap input:checked + label::after { opacity: 1; }

    .item-text {
      flex: 1;
      font-size: 0.95rem;
      color: #333;
      word-break: break-all;
      transition: all 0.2s;
    }
    .item.done .item-text {
      text-decoration: line-through;
      color: #bbb;
    }

    .btn-del {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #ccc;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s;
    }
    .btn-del:hover { background: #fee2e2; color: #ef4444; }

    /* ── Footer actions ── */
    .footer-actions {
      padding: 12px 20px 20px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: flex-end;
    }
    .btn-clear {
      padding: 8px 16px;
      border: none;
      border-radius: 10px;
      background: #f5f5f8;
      color: #999;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    .btn-clear:hover { background: #fee2e2; color: #ef4444; }
    .btn-clear:disabled { opacity: 0.4; cursor: default; }
    .btn-clear:disabled:hover { background: #f5f5f8; color: #999; }
  </style>
</head>
<body>

<div class="card">
  <!-- Header -->
  <div class="header">
    <h1>🛒 쇼핑리스트</h1>
    <p>오늘 사야 할 것들을 기록하세요</p>
    <div class="summary">
      <div class="badge">전체 <span id="totalCount">0</span>개</div>
      <div class="badge">완료 <span id="doneCount">0</span>개</div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <input type="text" id="itemInput" placeholder="아이템을 입력하세요..." maxlength="80" />
      <button class="btn-add" id="addBtn">+ 추가</button>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-tabs">
    <button class="tab active" data-filter="all">전체</button>
    <button class="tab" data-filter="todo">미완료</button>
    <button class="tab" data-filter="done">완료</button>
  </div>

  <!-- List -->
  <div class="list-area" id="listArea"></div>

  <!-- Footer -->
  <div class="footer-actions">
    <button class="btn-clear" id="clearDoneBtn">완료 항목 지우기</button>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────
  const STORAGE_KEY = 'shopping-list-v1';

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function save(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  let items = load();       // [{ id, text, done }]
  let filter = 'all';       // 'all' | 'todo' | 'done'
  let nextId = Date.now();

  // ── DOM refs ───────────────────────────────────────────
  const inputEl      = document.getElementById('itemInput');
  const addBtn       = document.getElementById('addBtn');
  const listArea     = document.getElementById('listArea');
  const totalCount   = document.getElementById('totalCount');
  const doneCount    = document.getElementById('doneCount');
  const clearDoneBtn = document.getElementById('clearDoneBtn');
  const tabs         = document.querySelectorAll('.tab');

  // ── Actions ────────────────────────────────────────────
  function addItem() {
    const text = inputEl.value.trim();
    if (!text) { inputEl.focus(); return; }
    items.unshift({ id: nextId++, text, done: false });
    save(items);
    inputEl.value = '';
    inputEl.focus();
    render();
  }

  function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (item) { item.done = !item.done; save(items); render(); }
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    save(items);
    render();
  }

  function clearDone() {
    items = items.filter(i => !i.done);
    save(items);
    render();
  }

  // ── Render ─────────────────────────────────────────────
  function render() {
    // summary
    totalCount.textContent = items.length;
    doneCount.textContent  = items.filter(i => i.done).length;

    // clear button
    clearDoneBtn.disabled = !items.some(i => i.done);

    // filter
    const visible = items.filter(i => {
      if (filter === 'done') return i.done;
      if (filter === 'todo') return !i.done;
      return true;
    });

    if (visible.length === 0) {
      const msg = filter === 'done'  ? '완료된 항목이 없습니다.'
                : filter === 'todo'  ? '미완료 항목이 없습니다.'
                : '아이템을 추가해 보세요!';
      listArea.innerHTML = `
        <div class="empty-state">
          <div class="icon">${filter === 'done' ? '✅' : '🛒'}</div>
          <p>${msg}</p>
        </div>`;
      return;
    }

    listArea.innerHTML = visible.map(item => `
      <div class="item${item.done ? ' done' : ''}" data-id="${item.id}">
        <div class="checkbox-wrap">
          <input type="checkbox" id="chk-${item.id}" ${item.done ? 'checked' : ''} />
          <label for="chk-${item.id}"></label>
        </div>
        <span class="item-text">${escHtml(item.text)}</span>
        <button class="btn-del" title="삭제">✕</button>
      </div>
    `).join('');

    // delegate events
    listArea.querySelectorAll('input[type="checkbox"]').forEach(chk => {
      chk.addEventListener('change', () => toggleItem(+chk.closest('.item').dataset.id));
    });
    listArea.querySelectorAll('.btn-del').forEach(btn => {
      btn.addEventListener('click', () => deleteItem(+btn.closest('.item').dataset.id));
    });
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Event listeners ────────────────────────────────────
  addBtn.addEventListener('click', addItem);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  clearDoneBtn.addEventListener('click', clearDone);
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      filter = tab.dataset.filter;
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      render();
    });
  });

  // ── Init ───────────────────────────────────────────────
  render();
  inputEl.focus();
</script>
</body>
</html>
